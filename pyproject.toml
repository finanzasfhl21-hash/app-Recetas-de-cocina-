[project]
name = "recetas-de-cocina"
version = "0.1.0"
description = "Aplicacion web de gestion de recetas de cocina (MVC + Flask + SQLite)"
authors = [
    { name = "finanzasfhl21-hash", email = "finanzasfhl21@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff.lint]
# DTZ: la app usa fechas locales de calendario (planificador, "hoy"), no
# instantes en el tiempo, por lo que datetime tz-aware no aplica aqui.
ignore = ["DTZ"]
